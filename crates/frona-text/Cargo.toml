[package]
description = "Unicode-aware text matching and workspace search primitives"
license-file = "LICENSE"
readme = false
repository = "https://git.mcx.ai/mina/frona"
name = "frona-text"
edition.workspace = true
version.workspace = true

[dependencies]
unicode-normalization-alignments = "0.1"
unicode-casefold = "0.2"
unicode_categories = "0.1"
ignore = "0.4"
serde = { workspace = true, optional = true }
minijinja = { version = "3", optional = true }
rtb-redact = { version = "0.6", optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
prompts = ["dep:minijinja"]
redaction = ["dep:rtb-redact", "dep:serde_json"]
serde = ["dep:serde"]

[dev-dependencies]
tempfile = "3"
