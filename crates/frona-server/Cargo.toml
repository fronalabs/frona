[package]
name = "frona-server"
edition.workspace = true
version.workspace = true
default-run = "frona"

[lib]
name = "frona"
path = "src/lib.rs"

[[bin]]
name = "frona"
path = "src/main.rs"

[dependencies]
frona-sandbox = { path = "../frona-sandbox", version = "0.1.0" }
frona-pkm = { path = "../frona-pkm", version = "0.1.0" }
frona-harness = { path = "../frona-harness", version = "0.1.0" }
frona-cli-mcp = { path = "../frona-cli-mcp" }
frona-model-catalog = { path = "../frona-model-catalog" }
frona-api-types = { path = "../frona-api-types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Transliteration for page-path slugs. Already in the tree via surrealdb-core; declared
# directly because `storage::slugify` depends on it by name, not by accident.
arc-swap = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
struct-patch = "0.14"
argon2 = "0.6"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
rand = "0.10"
nanoid = "0.5"
aes-gcm = "0.11"
sha2 = "0.11"
blake3 = "1"
sha1 = "0.11"
hmac = "0.13"
hex = "0.4"
subtle = "2"
openidconnect = "4"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "http2", "multipart", "ws"] }
twilio-async = "0.5"
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler"] }
slack-morphism = { version = "2", features = ["hyper"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
pulldown-cmark = { version = "0.13", default-features = false }
telegram-markdown-v2 = "0.2"
# Same parser telegram-markdown-v2 uses internally; needed so fence_tables()
# agrees with the converter on what counts as a GFM table.
markdown = "1"
xml-rs = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "set-header", "timeout"] }
tower_governor = "0.8"
# 3.3 includes the in-memory engine's concurrent-write isolation fix.
surrealdb = { version = "=3.3.5", features = ["kv-rocksdb"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
frona-derive = { path = "../frona-derive" }
rig-core = { workspace = true }
rig-bedrock = "=0.46.0"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.143", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrock = { version = "=1.167.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
async-stream = { workspace = true }
serde-aux = { workspace = true }
base64 = { workspace = true }
serde_yaml = "0.9"
rtb-redact = "0.6"
config = { version = "0.15", features = ["yaml"] }
frona-browser = { path = "../frona-browser" }
frona-text = { path = "../frona-text", features = ["prompts"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.13", features = ["form", "json", "query", "rustls"], default-features = false }
url = "2"
backon = { workspace = true }
bon = { workspace = true }
moka = { workspace = true }
cedar-policy = { workspace = true }
dashmap = "6"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
cron = "0.17"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
vaultrs = { version = "0.8", default-features = false, features = ["rustls"] }
keepass = "0.17"
cookie = "0.18.1"
schemars = { version = "1", features = ["chrono04"] }
# Repairs the JSON some models emit as prose instead of a structured tool call - fences,
# trailing commas, truncation, and braces inside string values. Replaces a brace-counting
# scanner that had no string awareness and silently dropped any call it mis-terminated.
json_partial = "0.2"
# Case conversion for repairing the CURIEs models write (`support_email`,
# `Soldering Iron`, `firmwareversion`) into the house convention. Already in the tree via
# frona-derive; hand-rolling it produced a slug that lowercased whole words, which is how
# `supportEmail` became `frona:supportemail`.
tempfile = "3"
ignore = "0.4.25"
globset = "0.4"
unicode-normalization = "0.1"
regex = "1"
infer = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# 0.3 adds serde_yml/libyml, flagged by RUSTSEC-2025-0068/0067.
agent-skills = "0.2"
notify = "8"
rmcp = { version = "3.4.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
xz2 = "0.1"
inventory = "0.3"
jsonschema = { version = "0.61", default-features = false }

# RDF values and cached graph stores used by the persistence adapters.
oxrdf = "0.3"
oxigraph = { version = "0.5", default-features = false }
# Artifacts ship gzipped; the catalogue streams them rather than decompressing to disk.
flate2 = "1"

# Personal-WhatsApp adapter. Uses the stable-Rust `wa-rs` fork of
# `whatsapp-rust` - the upstream requires nightly.
wa-rs = { git = "https://github.com/homun-app/wa-rs", rev = "418ccf29279101f425e0657c45c77f91667d6409" }
wa-rs-proto = { git = "https://github.com/homun-app/wa-rs", rev = "418ccf29279101f425e0657c45c77f91667d6409" }
wa-rs-sqlite-storage = { git = "https://github.com/homun-app/wa-rs", rev = "418ccf29279101f425e0657c45c77f91667d6409" }
wa-rs-tokio-transport = { git = "https://github.com/homun-app/wa-rs", rev = "418ccf29279101f425e0657c45c77f91667d6409" }
wa-rs-ureq-http = { git = "https://github.com/homun-app/wa-rs", rev = "418ccf29279101f425e0657c45c77f91667d6409" }

# Pure-Rust Signal client. See workspace Cargo.toml for the git rev and the
# curve25519-dalek patch (both non-optional).
presage = { workspace = true }
presage-store-sqlite = { workspace = true }
smol_str = { version = "0.3.6", features = ["serde"] }


[[test]]
name = "mcp_e2e"
path = "tests/mcp_e2e.rs"

[[bin]]
name = "fake-mcp-server"
path = "tests/bin/fake_mcp_server.rs"
required-features = ["__test-bins"]

[features]
__test-bins = []

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
aws-credential-types = "1"
aws-smithy-eventstream = "0.61"
aws-smithy-async = "1"
aws-runtime = "1"
approx = "0.5"
surrealdb = { version = "=3.3.5", features = ["kv-mem"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "3.4.1", features = ["client", "server", "macros", "transport-child-process", "transport-async-rw", "transport-streamable-http-server"] }
wiremock = "0.6"
