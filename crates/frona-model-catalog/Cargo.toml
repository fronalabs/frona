[package]
description = "Provider-independent model catalog, validation, and cached snapshots"
license-file = "LICENSE"
readme = "README.md"
repository = "https://git.mcx.ai/mina/frona"
name = "frona-model-catalog"
edition.workspace = true
version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
arc-swap = "1"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }

[dev-dependencies]
wiremock = "0.6"

