[package]
name = "frona-standalone-consumer"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "frona-standalone-consumer"

# Isolate feature resolution from the server and harness dev-dependencies.
[workspace]

[features]
jsonl = ["frona-harness/jsonl"]

[dependencies]
frona-harness = { path = "../../.." }
async-trait = "0.1"
rig-core = "0.42"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }

[[bin]]
name = "tools"
path = "../../../examples/tools.rs"

[[bin]]
name = "basic"
path = "../../../examples/basic.rs"

[[bin]]
name = "refinement"
path = "../../../examples/refinement.rs"

[[bin]]
name = "manual"
path = "../../../examples/manual.rs"

[[bin]]
name = "budgets"
path = "../../../examples/budgets.rs"

[[bin]]
name = "workspace"
path = "../../../examples/workspace.rs"

[[bin]]
name = "progress"
path = "../../../examples/progress.rs"

[[bin]]
name = "jsonl"
path = "../../../examples/jsonl.rs"
required-features = ["jsonl"]

[[test]]
name = "ownership"
path = "../../ownership.rs"

[[test]]
name = "portable_dtos"
path = "../../portable_dtos.rs"
