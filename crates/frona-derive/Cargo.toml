[package]
description = "Derive macros for Frona entities, tools, and inference parameter metadata"
license-file = "LICENSE"
readme = false
repository = "https://git.mcx.ai/mina/frona"
name = "frona-derive"
edition.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
