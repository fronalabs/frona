[package]
name = "frona-standalone-consumer"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "frona-standalone-consumer"

# Isolate feature resolution from the server and harness dev-dependencies.
[workspace]

[features]
jsonl = ["frona-harness/jsonl"]

[dependencies]
frona-harness = { path = "../../.." }
async-trait = "0.1"
rig-core = "0.42"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }

[[bin]]
name = "sdk_tools"
path = "../../../examples/sdk_tools.rs"

[[bin]]
name = "sdk_basic"
path = "../../../examples/sdk_basic.rs"

[[bin]]
name = "sdk_refinement"
path = "../../../examples/sdk_refinement.rs"

[[bin]]
name = "sdk_manual"
path = "../../../examples/sdk_manual.rs"

[[bin]]
name = "sdk_budgets"
path = "../../../examples/sdk_budgets.rs"

[[bin]]
name = "sdk_workspace"
path = "../../../examples/sdk_workspace.rs"

[[bin]]
name = "sdk_progress"
path = "../../../examples/sdk_progress.rs"

[[bin]]
name = "sdk_jsonl"
path = "../../../examples/sdk_jsonl.rs"
required-features = ["jsonl"]

[[test]]
name = "ownership"
path = "../../ownership.rs"

[[test]]
name = "portable_dtos"
path = "../../portable_dtos.rs"
