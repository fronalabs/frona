[package]
name = "frona-standalone-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# Isolate feature resolution from the server and harness dev-dependencies.
[workspace]

[features]
jsonl = ["frona-harness/jsonl"]

[dependencies]
frona-harness = { path = "../../.." }
async-trait = "0.1"
rig-core = "0.42"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tempfile = "3"

[[bin]]
name = "sdk_tools"
path = "../../../examples/sdk_tools.rs"
