[package]
name = "frona-server"
edition.workspace = true
version.workspace = true
default-run = "frona"

[lib]
name = "frona"
path = "src/lib.rs"

[[bin]]
name = "frona"
path = "src/main.rs"

[dependencies]
frona-model-catalog = { path = "../frona-model-catalog" }
frona-api-types = { path = "../frona-api-types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Transliteration for page-path slugs. Already in the tree via surrealdb-core; declared
# directly because `storage::slugify` depends on it by name, not by accident.
deunicode = "1"
arc-swap = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
struct-patch = "0.13"
argon2 = "0.5"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
rand = "0.10"
nanoid = "0.5"
aes-gcm = "0.11"
similar = "3"
strsim = "0.11"
sha2 = "0.11"
blake3 = "1"
sha1 = "0.11"
hmac = "0.13"
hex = "0.4"
subtle = "2"
openidconnect = "4"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "http2", "multipart", "ws"] }
twilio-async = "0.5"
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler"] }
slack-morphism = { version = "2", features = ["hyper"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
pulldown-cmark = { version = "0.13", default-features = false }
telegram-markdown-v2 = "0.2"
# Same parser telegram-markdown-v2 uses internally; needed so fence_tables()
# agrees with the converter on what counts as a GFM table.
markdown = "1"
xml-rs = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "set-header"] }
tower_governor = "0.8"
surrealdb = { version = "3.0.0", features = ["kv-rocksdb"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
frona-derive = { path = "../frona-derive" }
rig-core = { workspace = true }
rig-bedrock = "=0.42.0"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.143", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrock = { version = "=1.157.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
async-stream = { workspace = true }
serde-aux = { workspace = true }
base64 = { workspace = true }
serde_yaml = "0.9"
rtb-redact = "0.6"
config = { version = "0.15", features = ["yaml"] }
frona-browser = { path = "../frona-browser" }
frona-text = { path = "../frona-text" }
tokio-util = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.13", features = ["form", "json", "query", "rustls"], default-features = false }
url = "2"
backon = { workspace = true }
bon = { workspace = true }
moka = { workspace = true }
cedar-policy = { workspace = true }
dashmap = "6"
libc = "0.2"
cron = "0.17"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
vaultrs = { version = "0.8", default-features = false, features = ["rustls"] }
keepass = "0.13"
cookie = "0.18.1"
minijinja = "2"
schemars = { version = "1", features = ["chrono04"] }
# Repairs the JSON some models emit as prose instead of a structured tool call - fences,
# trailing commas, truncation, and braces inside string values. Replaces a brace-counting
# scanner that had no string awareness and silently dropped any call it mis-terminated.
json_partial = "0.2"
# Case conversion for repairing the CURIEs models write (`support_email`,
# `Soldering Iron`, `firmwareversion`) into the house convention. Already in the tree via
# frona-derive; hand-rolling it produced a slug that lowercased whole words, which is how
# `supportEmail` became `frona:supportemail`.
heck = "0.5"
tempfile = "3"
ignore = "0.4.25"
globset = "0.4"
unicode-normalization = "0.1"
regex = "1"
infer = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
agent-skills = "0.2"
notify = "8"
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
xz2 = "0.1"
inventory = "0.3"
jsonschema = { version = "0.49", default-features = false }

# horned-owl: typed OWL schema building + I/O; reasonable: OWL 2 RL materializer
# + validation diagnostics; oxsdatatypes: XSD datatype/facet checks (code);
# oxrdf: shared RDF term model; oxigraph (no default features → pure-Rust
# in-memory store, no RocksDB C++) : SPARQL query + reactive substrate.
horned-owl = "3"
reasonable = "0.4"
oxsdatatypes = "0.2"
oxrdf = "0.3"
oxigraph = { version = "0.5", default-features = false }
# Artifacts ship gzipped; the catalogue streams them rather than decompressing to disk.
flate2 = "1"

# The graph extractor, shared rather than copied. `default-features = false` drops
# the `cli` feature, leaving `graph` + `rdf` - whose only direct dependencies are
# oxigraph, oxrdf, flate2 and anyhow, all already here. `ureq`, `reasonable` and
# `owo-colors` stay behind, so this adds no new crates to the binary.
#
# Sharing is the point: `tests/equivalent_to_reasoner.rs` runs in that repo's CI and
# asserts, in both directions, that the ancestor walk equals OWL 2 RL over the whole
# catalogue. A reimplementation here would be a second implementation with no such
# contract, drifting exactly where drift is silent.
#
# Pinned to a *commit*, not a release tag: tags mark artifact publications and the
# extractor moves on a different clock. Nothing yet checks that the pinned crate and
# the pinned artifacts agree - `metadata.json` carrying the building commit is the fix.
frona-ontologies = { git = "https://github.com/fronalabs/frona-ontologies", rev = "cdabc3a8dba85f418c080d659da36d47b4a9c442", default-features = false }

# Personal-WhatsApp adapter. Uses the stable-Rust `wa-rs` fork of
# `whatsapp-rust` - the upstream requires nightly.
wa-rs = { git = "https://github.com/homunbot/wa-rs", rev = "d3695821e8cc435d14768188bc39bcfaffb96f1f" }
wa-rs-proto = { git = "https://github.com/homunbot/wa-rs", rev = "d3695821e8cc435d14768188bc39bcfaffb96f1f" }
wa-rs-sqlite-storage = { git = "https://github.com/homunbot/wa-rs", rev = "d3695821e8cc435d14768188bc39bcfaffb96f1f" }
wa-rs-tokio-transport = { git = "https://github.com/homunbot/wa-rs", rev = "d3695821e8cc435d14768188bc39bcfaffb96f1f" }
wa-rs-ureq-http = { git = "https://github.com/homunbot/wa-rs", rev = "d3695821e8cc435d14768188bc39bcfaffb96f1f" }

# Pure-Rust Signal client. See workspace Cargo.toml for the git rev and the
# curve25519-dalek patch (both non-optional).
presage = { workspace = true }
presage-store-sqlite = { workspace = true }
smol_str = { version = "0.3.6", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[[test]]
name = "mcp_e2e"
path = "tests/mcp_e2e.rs"

[[bin]]
name = "fake-mcp-server"
path = "tests/bin/fake_mcp_server.rs"
required-features = ["__test-bins"]

[features]
__test-bins = []

[dev-dependencies]
aws-credential-types = "1"
aws-smithy-eventstream = "0.61"
aws-smithy-async = "1"
aws-runtime = "1"
approx = "0.5"
surrealdb = { version = "3.0.0", features = ["kv-mem"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "3", features = ["client", "server", "macros", "transport-child-process", "transport-async-rw"] }
wiremock = "0.6"
