services:
  browserless:
    image: ghcr.io/browserless/chromium:v2.42.0
    ports:
      - "3333:3333"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=true
      - PORT=3333
      - TIMEOUT=1800000
    volumes:
      - ../data/browser_profiles:/profiles
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}

  searxng:
    image: docker.io/searxng/searxng:2026.5.9-0cba32c15
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      - SEARXNG_SECRET=change-me-to-something-random
      - FORCE_OWNERSHIP=false
    volumes:
      - ./dev/searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}

  frona-dev:
    profiles: [dev]
    image: localhost/frona-dev:local
    security_opt:
      - seccomp:unconfined
    build:
      context: ..
      dockerfile: build/Dockerfile
      target: dev
      args:
        DEV_UID: ${CONTAINER_UID:-1000}
        DEV_GID: ${CONTAINER_GID:-1000}
    ports:
      - "3001:3001"
      - "3000:3000"
    volumes:
      - ../crates:/app/crates
      - ../Cargo.toml:/app/Cargo.toml
      - ../Cargo.lock:/app/Cargo.lock
      - cargo-cache:/app/target
      - ../target/sccache:/cache/sccache
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - node-modules:/app/web/node_modules
      - ../web:/app/web
      - ../resources:/app/resources
      - ../build:/app/build
      - ../data:/app/data
    environment:
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-}
      - CARGO_TERM_COLOR=always
      - FORCE_COLOR=1
      - CLICOLOR_FORCE=1
      - ANTHROPIC_API_KEY
      - FRONA_SERVER_CORS_ORIGINS
      - FRONA_SERVER_BACKEND_URL
      - FRONA_SERVER_FRONTEND_URL
      - FRONA_LOG_LEVEL=debug
      - FRONA_BROWSER_WS_URL=ws://browserless:3333
      - FRONA_SEARCH_SEARXNG_BASE_URL=http://searxng:8080
      - FRONA_SERVER_PORT=3001
      # The VM has ample CPU/RAM; four jobs unnecessarily throttles incremental builds.
      - CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-8}
      # Keep useful line-level backtraces without producing and relinking a multi-GB
      # debug binary on every backend edit.
      - CARGO_PROFILE_DEV_DEBUG=line-tables-only
      - CARGO_PROFILE_TEST_DEBUG=line-tables-only
      - RUSTC_WRAPPER=sccache
      - SCCACHE_DIR=/cache/sccache
      - SCCACHE_CACHE_SIZE=${SCCACHE_CACHE_SIZE:-40G}
      # GNU ld dominated backend restart time. LLVM lld is installed in the dev image.
      - CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=clang
      - CARGO_ENCODED_RUSTFLAGS=-Clink-arg=-fuse-ld=lld
      - SURREAL_SYNC_DATA=true
      - FRONA_VOICE_CALLBACK_BASE_URL
      - FRONA_VOICE_TWILIO_ACCOUNT_SID
      - FRONA_VOICE_TWILIO_AUTH_TOKEN
      - FRONA_VOICE_TWILIO_FROM_NUMBER
      - FRONA_VOICE_TWILIO_VOICE_ID
      - FRONA_VOICE_TWILIO_SPEECH_MODEL
    depends_on: [browserless, searxng]
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}

  frona:
    profiles: [prod]
    image: localhost/frona-prod:local
    cap_add:
      - SYS_PTRACE
    build:
      context: ..
      dockerfile: build/Dockerfile
      target: prod
    ports:
      - "3001:3001"
    volumes:
      - ../data:/app/data
    environment:
      - ANTHROPIC_API_KEY
      - FRONA_AUTH_ENCRYPTION_SECRET
      - FRONA_LOG_LEVEL=debug
      - FRONA_BROWSER_WS_URL=ws://browserless:3333
      - FRONA_SEARCH_SEARXNG_BASE_URL=http://searxng:8080
      - FRONA_VOICE_CALLBACK_BASE_URL
      - FRONA_VOICE_TWILIO_ACCOUNT_SID
      - FRONA_VOICE_TWILIO_AUTH_TOKEN
      - FRONA_VOICE_TWILIO_FROM_NUMBER
      - FRONA_VOICE_TWILIO_VOICE_ID
      - FRONA_VOICE_TWILIO_SPEECH_MODEL
    depends_on: [browserless, searxng]
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}

  ngrok:
    image: docker.io/ngrok/ngrok:latest
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}
    command:
      - http
      - frona-dev:3001
      - "--log=stdout"
      # - "--log-level=debug"
    environment:
      - NGROK_AUTHTOKEN
    ports:
      - "4040:4040"

volumes:
  cargo-cache:
  cargo-registry:
  cargo-git:
  node-modules:
