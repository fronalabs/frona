[tools]
rust = "1.98.1"
node = "24.19.0"
rust-analyzer = "latest"
"cargo:cargo-watch" = "latest"

[env]
FRONA_DATABASE_PATH = "data/db"
FRONA_LOG_LEVEL = "debug"
FRONA_SERVER_BACKEND_URL = "http://localhost:3001"
FRONA_SERVER_FRONTEND_URL = "http://localhost:3000"
FRONA_SERVER_PORT = "3001"
FRONA_SERVER_CORS_ORIGINS = "http://localhost:3000"
FRONA_BROWSER_WS_URL = "ws://localhost:3333"
FRONA_BROWSER_PROFILES_PATH = "/profiles"

[tasks.dev]
description = "Run backend + frontend in parallel"
depends = ["install-frontend", "dev:frontend", "dev:backend"]

[tasks."dev:frontend"]
description = "Run Next.js dev server"
dir = "web"
run = "npm run dev"

[tasks."dev:backend"]
description = "Run backend with cargo-watch"
run = "cargo watch -w crates/ -w Cargo.toml -w Cargo.lock --delay 3 -x 'run -p frona-server'"

[tasks.install-frontend]
description = "Install frontend dependencies"
dir = "web"
run = "npm ci"

[tasks.build]
description = "Production build (frontend + backend)"
depends = ["build:frontend", "build:backend"]

[tasks."build:frontend"]
description = "Build frontend static export"
dir = "web"
run = "npm ci && npm run build"

[tasks."build:backend"]
description = "Build backend release binary"
run = "cargo build --release -p frona-server"

[tasks.check]
description = "Cargo check all crates"
run = "cargo check --workspace"

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run clippy + frontend lint"
depends = ["fmt:check", "lint:backend", "lint:frontend"]

[tasks."lint:backend"]
description = "Run clippy"
run = "cargo clippy --workspace -- -D warnings"

[tasks."lint:frontend"]
description = "Run Next.js lint"
depends = ["install-frontend"]
dir = "web"
run = "npm run lint"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks."test:e2e"]
description = "Build the fake MCP server and run end-to-end tests"
run = """
cargo build -p frona-server --bin fake-mcp-server --features __test-bins
cargo test -p frona-server --test mcp_e2e -- --ignored
"""

[tasks."test:all"]
description = "Run all tests including end-to-end"
run = """
mise run test
mise run test:e2e
"""

[tasks.container]
description = "Build production Docker image"
run = "build/build.sh"

[tasks.release]
description = "Release: bump version, git tag, build and push Docker image"
run = "build/release.sh"

[tasks."container:publish"]
description = "Build production image and push to GHCR"
run = "build/publish.sh"

[tasks."container:publish:preview"]
description = "Build prod image and push to your personal preview registry (set FRONA_PREVIEW_IMAGE/FRONA_PREVIEW_TAG in mise.local.toml)"
run = '''
: "${FRONA_PREVIEW_IMAGE:?Set FRONA_PREVIEW_IMAGE in mise.local.toml}"
: "${FRONA_PREVIEW_TAG:?Set FRONA_PREVIEW_TAG in mise.local.toml}"
if [ "$FRONA_PREVIEW_IMAGE" = "ghcr.io/fronalabs/frona" ] && [ "$FRONA_PREVIEW_TAG" != "nightly" ]; then
  echo "FRONA_PREVIEW_IMAGE may only target the prod registry with tag 'nightly'" >&2
  exit 1
fi
build/publish.sh "$FRONA_PREVIEW_IMAGE:$FRONA_PREVIEW_TAG"
'''

[tasks."container:dev"]
description = "Run full dev stack in a container runtime (with hot-reload)"
run = "build/container.sh dev"

[tasks."container:dev:build"]
description = "Rebuild the dev image and run the stack"
run = "build/container.sh dev --build"

[tasks."container:dev:down"]
description = "Stop dev container stack and remove its volumes"
run = "build/container.sh dev down -v"

[tasks."container:prod"]
description = "Run production container stack"
run = "build/container.sh prod --build"

[tasks."container:prod:down"]
description = "Stop production container stack"
run = "build/container.sh prod down"

[tasks."container:update-versions"]
description = "Pull latest dependencies and update version locks"
run = "build/update-versions.sh"

[tasks.clean]
description = "Remove build artifacts and generated files"
run = """
bash build/clean-artifacts.sh
"""
