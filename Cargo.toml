[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "2026.9.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3.21", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rig-core = "0.42"
async-stream = "0.3"
serde-aux = "4"
base64 = "0.23"
backon = "1"
bon = "3"
moka = { version = "0.12", features = ["future", "sync"] }
cedar-policy = { version = "4", features = ["partial-eval"] }
# Git-only because the Signal client is not published on crates.io.
presage = { git = "https://github.com/whisperfish/presage", rev = "f74b96e0fb9099ce8be2b28b7ca9d11f78a6faea" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "f74b96e0fb9099ce8be2b28b7ca9d11f78a6faea" }

# Signal's fork of curve25519-dalek shares the upstream crate name, so
# `[patch.crates-io]` is the only way to substitute it. Mirrors presage's
# own root Cargo.toml.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
# Forces a single libsqlite3-sys across the graph: wa-rs's diesel wants 0.37
# while presage-store-sqlite pins 0.36, and `links = "sqlite3"` cannot duplicate.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
