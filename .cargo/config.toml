# Keep development artifacts small; concurrency is inherited from the environment.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# SurrealDB's unoptimized embedded query frames can exhaust the default thread
# stack beneath application futures. Tests inherit these dependency overrides.
[profile.dev.package.surrealdb-core]
opt-level = 1

[profile.dev.package.surrealdb-datastore]
opt-level = 1

[profile.dev.package.surrealdb-idx]
opt-level = 1

# Presage requires optimized ML-KEM to avoid stack overflow when decrypting
# PQXDH prekey messages in development and test builds.
[profile.dev.package.libcrux-ml-kem]
opt-level = 3
