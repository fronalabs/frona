default_job = "check"

# Include crate resources and the lockfile, as well as conventional Rust sources.
watch = ["crates", "Cargo.toml", "Cargo.lock"]

[jobs.check]
command = ["cargo", "check", "--workspace"]

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--", "-D", "warnings"]

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.server-container]
command = ["bash", "build/dev/watch.sh"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
grace_period = "3s"
kill = ["kill", "-s", "TERM"]
scroll_anchor = "auto"

[keybindings]
c = "job:clippy"
