[package]
description = "Validated model metadata, parameter schemas, and cached catalog snapshots"
license = "MIT"
readme = "README.md"
repository = "https://github.com/fronalabs/frona"
documentation = "https://docs.rs/frona-model-catalog"
keywords = ["ai", "models", "catalog"]
categories = ["data-structures", "caching"]
name = "frona-model-catalog"
edition.workspace = true
version = "0.1.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
arc-swap = "1"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }

[dev-dependencies]
wiremock = "0.6"


[package.metadata.docs.rs]
all-features = true
