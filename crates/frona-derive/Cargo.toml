[package]
description = "Procedural macros for Frona harness tools and Frona application integration"
license = "MIT"
readme = "README.md"
repository = "https://git.mcx.ai/mina/frona"
documentation = "https://docs.rs/frona-derive"
keywords = ["derive", "macros", "tools"]
categories = ["development-tools::procedural-macro-helpers"]
name = "frona-derive"
edition.workspace = true
version = "0.1.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
proc-macro-crate = "3.5"

[package.metadata.docs.rs]
all-features = true
